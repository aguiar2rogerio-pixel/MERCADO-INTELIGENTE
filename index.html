<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Lista de Compras Inteligente</title>
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<header>
    <h1>Lista de Compras</h1>
    <div class="input-group">
        <label class="visually-hidden" for="itemInput">Produto</label>
        <input type="text" id="itemInput" placeholder="Adicionar item (ex: Leite)" autocomplete="off">
        <button class="btn-add" id="btnAdd" aria-label="Adicionar produto">+</button>
        <div class="suggestions" id="suggestions"></div>
    </div>
</header>

<main>
    <section id="section-todo">
        <h2 style="display: flex; justify-content: space-between;">
            <span>Para Comprar</span>
            <span id="count-todo" style="font-size: 0.75rem; background: #333; padding: 2px 8px; border-radius: 10px;">0 itens</span>
        </h2>
        <div id="list-todo"></div>
    </section>

    <section id="section-cart">
        <h2 style="display: flex; justify-content: space-between;">
            <span>No Carrinho</span>
            <span id="count-cart" style="font-size: 0.75rem; background: var(--primary-color); color: white; padding: 2px 8px; border-radius: 10px;">0 itens</span>
        </h2>
        <div id="list-cart"></div>
    </section>

    <section id="section-history">
        <h2>Histórico por Mês</h2>
        
        <div class="month-pills" id="monthPillsContainer"></div>

        <!-- QUADRO COM ROLAGEM INTERNA PARA O HISTÓRICO -->
        <div class="history-scroll-box" id="history-container"></div>
        
        <div class="monthly-summary" id="monthly-summary">
            <div style="display: flex; justify-content: space-between;">
                <span id="label-total-month">Total do Mês:</span>
                <b id="total-month">R$ 0,00</b>
            </div>
            <div id="div-breakdown"></div>
        </div>

        <div class="backup-controls">
            <button class="btn-cancel" id="btnBackup" style="font-size: 0.85rem; padding: 10px;">💾 Criar Backup</button>
            <button class="btn-cancel" id="btnRestore" style="font-size: 0.85rem; padding: 10px;">🔄 Restaurar</button>
        </div>
    </section>
</main>

<footer>
    <div class="totals">
        <div class="total-item">
            <span>Estimado</span>
            <b id="val-estimated">R$ 0,00</b>
        </div>
        <div class="total-item" style="text-align: right;">
            <span>No Carrinho</span>
            <b id="val-real">R$ 0,00</b>
        </div>
    </div>
    <button class="btn-finish" id="btnFinish">Finalizar Compra</button>
    <button id="btnResetApp" style="background: none; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; padding: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 4px; opacity: 0.5;">ZERAR APLICATIVO (RESET TOTAL)</button>
</footer>

<!-- MODAL DE EDIÇÃO DO ITEM -->
<div class="modal-overlay" id="modalEdit">
    <div class="modal">
        <div class="form-row">
            <label for="editItemName">Nome do Produto</label>
            <input type="text" id="editItemName" autocomplete="off">
        </div>
        <div class="form-row">
            <label for="editType">Tipo</label>
            <select id="editType">
                <option value="un">Unidade (un)</option>
                <option value="kg">Peso (kg)</option>
            </select>
        </div>
        <div class="form-row">
            <label id="labelQty" for="editQty">Quantidade / Peso</label>
            <input type="number" id="editQty" step="any" inputmode="decimal" placeholder="Ex: 2 ou 0.500">
        </div>
        <div class="form-row">
            <label for="editPrice">Preço (R$)</label>
            <input type="number" id="editPrice" step="0.01" inputmode="decimal" placeholder="0,00">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" id="btnCancelEdit">Cancelar</button>
            <button class="btn-save" id="btnSaveEdit">Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL DE FINALIZAÇÃO DA COMPRA -->
<div class="modal-overlay" id="modalFinishPurchase">
    <div class="modal">
        <h3 class="modal-title" style="color: var(--primary-color);">Detalhes da Compra</h3>
        <div class="form-row">
            <label for="finishMarket">Onde foi a compra? (Mercado)</label>
            <input type="text" id="finishMarket" placeholder="Ex: Shibata" autocomplete="off">
            <div class="suggestions" id="marketSuggestions" style="right: 0;"></div>
        </div>
        <div class="form-row">
            <label for="finishBuyer">Quem pagou?</label>
            <input type="text" id="finishBuyer" placeholder="Ex: Rogério" autocomplete="off">
            <div class="suggestions" id="buyerSuggestions" style="right: 0;"></div>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" id="btnCancelFinish">Cancelar</button>
            <button class="btn-save" id="btnConfirmFinish">Confirmar</button>
        </div>
    </div>
</div>

<!-- MODAL DE VISUALIZAÇÃO E EDIÇÃO DO HISTÓRICO -->
<div class="modal-overlay" id="modalHistoryView">
    <div class="modal">
        <h3 class="modal-title" id="historyViewTitle">Editar Compra</h3>
        
        <div class="form-row">
            <label for="editHistoryMarket">Onde foi a compra? (Mercado)</label>
            <input type="text" id="editHistoryMarket" placeholder="Ex: Shibata" autocomplete="off">
            <div class="suggestions" id="editHistoryMarketSuggestions" style="right: 0;"></div>
        </div>
        <div class="form-row">
            <label for="editHistoryBuyer">Quem pagou? (Colaborador)</label>
            <input type="text" id="editHistoryBuyer" placeholder="Ex: Rogério" autocomplete="off">
            <div class="suggestions" id="editHistoryBuyerSuggestions" style="right: 0;"></div>
        </div>

        <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Itens Comprados:</label>
        <div class="history-preview-list" id="historyViewList"></div>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px; padding-top: 10px; border-top: 2px dashed #444;">
            <span>Total:</span>
            <b id="historyViewTotal" style="color: var(--primary-color); font-size: 1.1rem;">R$ 0,00</b>
        </div>

        <div class="modal-btns">
            <button class="btn-delete" id="btnDeleteHistory">Excluir</button>
            <button class="btn-cancel" id="btnCloseHistoryView">Cancelar</button>
            <button class="btn-save" id="btnSaveHistory">Salvar</button>
        </div>
    </div>
</div>


    <script src="app.js?v=6" defer></script>
</body>
</html>
