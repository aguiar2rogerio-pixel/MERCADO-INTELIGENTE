<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Lista de Compras</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{max-width:420px;padding:24px;border-radius:8px;background:#1e1e1e;text-align:center}
    h1{margin:0 0 8px;font-size:1.2rem}
    p{margin:0 0 12px;color:#bbb}
    button{background:#2ea44f;border:0;padding:10px 14px;border-radius:6px;color:#fff;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <h1>Você está offline</h1>
    <p>Algumas funcionalidades podem não estar disponíveis sem conexão. Tente novamente quando houver sinal.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
